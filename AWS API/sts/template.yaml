AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template to create an S3 bucket and an IAM role for STS AssumeRole
Parameters:
  BucketName:
    Type: String
    Description: The name of the S3 bucket
    Default: example-bucket-fboetti

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName

  StsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: StsRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::719623059777:root'
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: s3-access-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: '*'
                Resource:
                  - !GetAtt S3Bucket.Arn
                  - !Sub '${S3Bucket.Arn}/*'
                  - !Sub 'arn:aws:s3:::*'
